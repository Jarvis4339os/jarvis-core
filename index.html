<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS HUD AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #02060d; color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow-x: hidden; touch-action: manipulation; padding: 20px 0;
    }
    .core-container { position: relative; width: 270px; height: 270px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ring-outer { position: absolute; width: 100%; height: 100%; border: 2px dashed rgba(0,229,255,.4); border-radius: 50%; animation: rotateRing 12s linear infinite; }
    .ring-inner { position: absolute; width: 75%; height: 75%; border: 2px solid rgba(0,229,255,.8); border-top-color: transparent; border-radius: 50%; animation: rotateRingRev 5s linear infinite; box-shadow: 0 0 20px rgba(0,229,255,.3); }
    .center-orb { width: 95px; height: 95px; background: radial-gradient(circle, #00e5ff 0%, #00485c 80%); border-radius: 50%; box-shadow: 0 0 35px #00e5ff; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; letter-spacing: 2px; transition: all .3s ease; }
    .speaking { animation: pulseCore .8s infinite alternate; }
    .listening-mode { box-shadow: 0 0 55px #00ff66 !important; background: radial-gradient(circle, #00ff66 0%, #004d1a 80%) !important; }
    .thinking-mode { box-shadow: 0 0 55px #ffaa00 !important; background: radial-gradient(circle, #ffaa00 0%, #664400 80%) !important; }
    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateRingRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseCore {
      from { transform: scale(1); box-shadow: 0 0 35px #ff0055; background: radial-gradient(circle, #ff0055 0%, #4a0018 80%); }
      to { transform: scale(1.15); box-shadow: 0 0 65px #ff0055; background: radial-gradient(circle, #ff5588 0%, #4a0018 80%); }
    }
    .status-panel { margin-top: 35px; text-align: center; width: 90%; max-width: 450px; }
    #statusText { font-size: 14px; letter-spacing: 3px; opacity: .8; text-transform: uppercase; margin-bottom: 12px; }
    #transcript { background: rgba(0,229,255,.05); border: 1px solid rgba(0,229,255,.2); border-radius: 8px; padding: 15px; min-height: 55px; font-size: 15px; line-height: 1.5; text-shadow: 0 0 5px rgba(0,229,255,.5); }
    #errorBox { color: #ff4444; font-size: 12px; margin-top: 8px; word-break: break-word; }
  </style>
</head>
<body>

  <div class="core-container" id="core">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="center-orb" id="orb">JARVIS</div>
  </div>

  <div class="status-panel">
    <div id="statusText">TAP CORE TO START</div>
    <div id="transcript">Jarvis online hone ke liye taiyaar hai. Core par tap kijiye.</div>
    <div id="errorBox"></div>
  </div>

<script>
  const WORKER_URL = "https://jarvis-api.sachinsainimbd4339.workers.dev";

  const orb = document.getElementById('orb');
  const statusText = document.getElementById('statusText');
  const transcriptDiv = document.getElementById('transcript');
  const errorBox = document.getElementById('errorBox');

  let history = [];
  let isSpeaking = false;
  let activeLoop = false;
  let recognition = null;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initMic() {
    if (!SpeechRecognition) {
      errorBox.innerText = "Speech API not available.";
      return;
    }
    if (recognition) return;

    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      isSpeaking = false;
      statusText.innerText = 'JARVIS SUN RAHA HAI...';
      orb.className = 'center-orb listening-mode';
    };

    recognition.onresult = (event) => {
      const userText = event.results[0][0].transcript.trim();
      if (!userText) return;
      transcriptDiv.innerText = `Aap: "${userText}"`;
      orb.className = 'center-orb thinking-mode';
      statusText.innerText = 'JARVIS SOCH RAHA HAI...';
      handleCommand(userText);
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        errorBox.innerText = "App permissions mein jaakar Microphone allow karein.";
      }
      if (activeLoop && !isSpeaking) {
        setTimeout(startMicSafe, 800);
      }
    };

    recognition.onend = () => {
      if (activeLoop && !isSpeaking && !orb.className.includes('thinking')) {
        setTimeout(startMicSafe, 300);
      }
    };
  }

  function startMicSafe() {
    if (!activeLoop || isSpeaking) return;
    try {
      if (!recognition) initMic();
      recognition.start();
    } catch (e) {}
  }

  function stopMicSafe() {
    if (!recognition) return;
    try { recognition.abort(); } catch (e) {}
  }

  document.getElementById('core').onclick = () => {
    if (!activeLoop) {
      activeLoop = true;
      errorBox.innerText = "";
      initMic();
      speak("Namaste sir. Jarvis taiyaar hai. Kahiye, main kya karoon?", () => {
        startMicSafe();
      });
    } else {
      activeLoop = false;
      isSpeaking = false;
      stopMicSafe();
      if (window.speechSynthesis) speechSynthesis.cancel();
      orb.className = 'center-orb';
      statusText.innerText = 'STANDBY - TAP TO START';
    }
  };

  function handleCommand(text) {
    const t = text.toLowerCase();
    if (/(band karo|so jao|stop jarvis|alvida)/.test(t)) {
      activeLoop = false;
      speak("Standby par ja raha hoon sir.", () => {
        stopMicSafe();
        orb.className = 'center-orb';
        statusText.innerText = 'STANDBY - TAP TO START';
      });
      return;
    }
    if (/(time|samay|baje|टाइम|समय)/.test(t)) {
      speak(`Sir, abhi ${new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })} ho rahe hain.`, () => startMicSafe());
      return;
    }
    if (/(date|tarikh|din|तारीख)/.test(t)) {
      speak(`Sir, aaj ${new Date().toLocaleDateString('hi-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} hai.`, () => startMicSafe());
      return;
    }
    if (/(youtube|यूट्यूब)/.test(t) && /(khol|open)/.test(t)) {
      speak("YouTube khol raha hoon sir.");
      window.location.href = "vnd.youtube://";
      return;
    }
    if (/(google|गूगल)/.test(t) && /(khol|open)/.test(t)) {
      speak("Google khol raha hoon sir.");
      window.location.href = "googlechrome://";
      return;
    }
    askGemini(text);
  }

  async function askGemini(promptText) {
    errorBox.innerText = "";
    history.push({ role: "user", parts: [{ text: promptText }] });
    if (history.length > 14) history = history.slice(-14);
    if (history[0].role !== "user") history.shift();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
        signal: AbortSignal.timeout(25000)
      });
      const data = await res.json();

      if (!res.ok || !data.reply) {
        history.pop();
        errorBox.innerText = "Worker Error: " + (data.error || res.status);
        speak("Sir, connection mein issue aaya hai.", () => startMicSafe());
        return;
      }

      history.push({ role: "model", parts: [{ text: data.reply }] });
      speak(data.reply, () => startMicSafe());
    } catch (err) {
      history.pop();
      errorBox.innerText = "Connection error: " + err.message;
      speak("Sir, internet se connect nahi ho pa raha.", () => startMicSafe());
    }
  }

  function speak(text, onFinish) {
    transcriptDiv.innerText = `JARVIS: ${text}`;
    if (!window.speechSynthesis) {
      if (onFinish) onFinish();
      return;
    }

    stopMicSafe();
    speechSynthesis.cancel();
    isSpeaking = true;

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'hi-IN';
    u.rate = 1.0;
    u.pitch = 0.7;

    let executed = false;
    const finishCallback = () => {
      if (executed) return;
      executed = true;
      isSpeaking = false;
      orb.className = 'center-orb';
      if (onFinish) onFinish();
    };

    u.onstart = () => {
      orb.className = 'center-orb speaking';
      statusText.innerText = 'JARVIS BOL RAHA HAI...';
    };
    u.onend = finishCallback;
    u.onerror = finishCallback;

    setTimeout(finishCallback, 3000 + text.length * 80);
    speechSynthesis.speak(u);
  }
</script>
</body>
</html>
