<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS HUD AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #02060d; color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow-x: hidden; touch-action: manipulation; padding: 20px 0;
    }
    .core-container { position: relative; width: 270px; height: 270px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ring-outer { position: absolute; width: 100%; height: 100%; border: 2px dashed rgba(0,229,255,.4); border-radius: 50%; animation: rotateRing 12s linear infinite; }
    .ring-inner { position: absolute; width: 75%; height: 75%; border: 2px solid rgba(0,229,255,.8); border-top-color: transparent; border-radius: 50%; animation: rotateRingRev 5s linear infinite; box-shadow: 0 0 20px rgba(0,229,255,.3); }
    .center-orb { width: 95px; height: 95px; background: radial-gradient(circle, #00e5ff 0%, #00485c 80%); border-radius: 50%; box-shadow: 0 0 35px #00e5ff; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; letter-spacing: 2px; transition: all .3s ease; }
    .speaking { animation: pulseCore .8s infinite alternate; }
    .listening-mode { box-shadow: 0 0 55px #00ff66 !important; background: radial-gradient(circle, #00ff66 0%, #004d1a 80%) !important; }
    .thinking-mode { box-shadow: 0 0 55px #ffaa00 !important; background: radial-gradient(circle, #ffaa00 0%, #664400 80%) !important; }
    @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateRingRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseCore {
      from { transform: scale(1); box-shadow: 0 0 35px #ff0055; background: radial-gradient(circle, #ff0055 0%, #4a0018 80%); }
      to { transform: scale(1.15); box-shadow: 0 0 65px #ff0055; background: radial-gradient(circle, #ff5588 0%, #4a0018 80%); }
    }
    .status-panel { margin-top: 35px; text-align: center; width: 90%; max-width: 450px; }
    #statusText { font-size: 14px; letter-spacing: 3px; opacity: .8; text-transform: uppercase; margin-bottom: 12px; }
    #transcript { background: rgba(0,229,255,.05); border: 1px solid rgba(0,229,255,.2); border-radius: 8px; padding: 15px; min-height: 55px; font-size: 15px; line-height: 1.5; text-shadow: 0 0 5px rgba(0,229,255,.5); }
    #errorBox { color: #ff4444; font-size: 12px; margin-top: 8px; word-break: break-word; }
  </style>
</head>
<body>

  <div class="core-container" id="core">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="center-orb" id="orb">JARVIS</div>
  </div>

  <div class="status-panel">
    <div id="statusText">TAP CORE TO START</div>
    <div id="transcript">Jarvis online hai. Ek baar tap karein...</div>
    <div id="errorBox"></div>
  </div>

<script>
  // ===== CONFIG =====
  // Apne Cloudflare Worker ka link yahan daalein. API key ab is file mein NAHI hai.
  const WORKER_URL = "https://jarvis-api.YOUR-NAME.workers.dev";

  // ===== ELEMENTS =====
  const orb = document.getElementById('orb');
  const statusText = document.getElementById('statusText');
  const transcriptDiv = document.getElementById('transcript');
  const errorBox = document.getElementById('errorBox');

  let history = [];          // conversation memory
  let isSpeaking = false;
  let activeLoop = false;
  let currentUtterance = null; // GC bug se bachane ke liye global reference
  let voices = [];

  // ===== VOICES =====
  function loadVoices() {
    voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices; // Chrome voices baad mein load karta hai
  }

  function pickVoice() {
    return voices.find(v => v.lang.toLowerCase().startsWith('hi') && /male|man/i.test(v.name))
        || voices.find(v => v.lang.toLowerCase().startsWith('hi'))
        || voices.find(v => v.lang === 'en-IN')
        || null;
  }

  // ===== SPEECH RECOGNITION =====
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN'; // hi-IN Hinglish (Hindi + English words) dono samajhta hai

    recognition.onstart = () => {
      if (!isSpeaking) {
        statusText.innerText = 'JARVIS SUN RAHA HAI...';
        orb.className = 'center-orb listening-mode';
      }
    };

    recognition.onresult = (event) => {
      const userText = event.results[0][0].transcript.trim();
      if (!userText) return;
      transcriptDiv.innerText = `Aap: "${userText}"`;
      orb.className = 'center-orb thinking-mode';
      statusText.innerText = 'JARVIS SOCH RAHA HAI...';
      handleCommand(userText);
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        errorBox.innerText = "Mic permission nahi mili. Browser settings mein mic allow karein (HTTPS / GitHub Pages par hi chalega).";
        stopJarvis();
      }
      // 'no-speech' / 'aborted' normal hain, onend loop sambhal lega
    };

    recognition.onend = () => {
      if (!isSpeaking && orb.className.includes('listening')) orb.className = 'center-orb';
      if (activeLoop && !isSpeaking && !orb.className.includes('thinking')) setTimeout(restartListening, 400);
    };
  }

  function restartListening() {
    if (!activeLoop || isSpeaking || !recognition) return;
    try { recognition.start(); } catch (e) {}
  }

  // ===== START / STOP =====
  document.getElementById('core').onclick = () => activeLoop ? stopJarvis() : startJarvis();

  function startJarvis() {
    if (!SpeechRecognition) {
      errorBox.innerText = "Is browser mein voice recognition nahi hai. Android/PC par Google Chrome use karein.";
      return;
    }
    if (WORKER_URL.includes("YOUR-NAME")) {
      errorBox.innerText = "Code mein WORKER_URL abhi set nahi hai. Apne Cloudflare Worker ka link daalein.";
    }
    activeLoop = true;
    speak("Namaste sir. Jarvis activate ho chuka hai. Boliye, main aapki kya help karoon?");
  }

  function stopJarvis() {
    activeLoop = false;
    isSpeaking = false;
    try { recognition && recognition.abort(); } catch (e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
    orb.className = 'center-orb';
    statusText.innerText = 'TAP CORE TO START';
  }

  // ===== COMMANDS =====
  function handleCommand(text) {
    const t = text.toLowerCase();
    if (/(band karo|so jao|stop jarvis|bye|alvida)/.test(t)) {
      speak("Theek hai sir, main standby mode mein ja raha hoon.", () => stopJarvis());
      return;
    }
    if (/(time|samay|baje|टाइम|समय|बजे)/.test(t)) {
      speak(`Sir, abhi ${new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })} ho rahe hain.`);
      return;
    }
    if (/(date|tarikh|aaj kya din|तारीख)/.test(t)) {
      speak(`Sir, aaj ${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} hai.`);
      return;
    }
    if (/(youtube|यूट्यूब)/.test(t) && /(khol|open|खोल)/.test(t)) {
      speak("YouTube khol raha hoon sir."); window.open("https://www.youtube.com", "_blank"); return;
    }
    if (/(google|गूगल)/.test(t) && /(khol|open|खोल)/.test(t)) {
      speak("Google khol raha hoon sir."); window.open("https://www.google.com", "_blank"); return;
    }
    askGemini(text);
  }

  // ===== GEMINI (Cloudflare Worker ke through) =====
  async function askGemini(promptText) {
    errorBox.innerText = "";
    history.push({ role: "user", parts: [{ text: promptText }] });
    if (history.length > 16) history = history.slice(-16); // sirf last 8 baatein yaad rakho
    if (history[0].role !== "user") history.shift();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history }),
        signal: AbortSignal.timeout(30000)
      });
      const data = await res.json();

      if (!res.ok || !data.reply) {
        history.pop();
        if (data.status === 401 || data.status === 403) {
          errorBox.innerText = "Gemini key galat/band hai. Cloudflare mein GEMINI_KEY secret badlein.";
        } else {
          errorBox.innerText = "Server Error: " + (data.error || res.status);
        }
        smartLocalAI(promptText);
        return;
      }

      history.push({ role: "model", parts: [{ text: data.reply }] });
      speak(data.reply);
    } catch (err) {
      history.pop();
      errorBox.innerText = "Worker se connect nahi hua: " + err.message;
      smartLocalAI(promptText);
    }
  }

  // ===== OFFLINE FALLBACK =====
  function smartLocalAI(text) {
    const t = text.toLowerCase();
    let reply;
    if (/(kaun ho|who are you|naam|कौन|नाम)/.test(t)) reply = "Main JARVIS hoon sir, aapka personal Avengers AI assistant.";
    else if (/(kaise ho|haal|कैसे)/.test(t)) reply = "Main bilkul badhiya hoon sir. Aap batayein aaj kya naya banana hai?";
    else if (/(iron man|tony|avengers|आयरन)/.test(t)) reply = "Stark protocols fully active hain sir. Mark suits standby par hain.";
    else reply = "Sorry sir, abhi main online brain se connect nahi ho pa raha. Please internet check karein.";
    speak(reply);
  }

  // ===== TEXT TO SPEECH =====
  function speak(text, after) {
    transcriptDiv.innerText = `JARVIS: ${text}`;
    if (!window.speechSynthesis) { if (after) after(); return; }

    speechSynthesis.cancel();
    isSpeaking = true;
    try { recognition && recognition.abort(); } catch (e) {}

    const u = new SpeechSynthesisUtterance(text);
    currentUtterance = u;
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'hi-IN'; }
    u.pitch = 0.7;
    u.rate = 1.0;

    let finished = false;
    const done = () => {
      if (finished) return; finished = true;
      clearTimeout(safety);
      isSpeaking = false;
      orb.className = 'center-orb';
      if (after) { after(); return; }
      if (activeLoop) { statusText.innerText = 'JARVIS SUN RAHA HAI...'; setTimeout(restartListening, 350); }
    };
    // Android Chrome kabhi onend fire nahi karta, isliye backup timer
    const safety = setTimeout(done, 4000 + text.length * 90);

    u.onstart = () => { orb.className = 'center-orb speaking'; statusText.innerText = 'JARVIS BOL RAHA HAI...'; };
    u.onend = done;
    u.onerror = done;
    speechSynthesis.speak(u);
  }
</script>
</body>
</html>
