<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS Voice Agent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #02060d;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .core-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      animation: rotateRing 12s linear infinite;
    }

    .ring-inner {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 2px solid rgba(0, 229, 255, 0.8);
      border-top-color: transparent;
      border-radius: 50%;
      animation: rotateRingRev 5s linear infinite;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .center-orb {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #00e5ff 0%, #00485c 80%);
      border-radius: 50%;
      box-shadow: 0 0 35px #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .speaking {
      animation: pulseCore 0.8s infinite alternate;
    }

    .listening-mode {
      box-shadow: 0 0 55px #00ff66 !important;
      background: radial-gradient(circle, #00ff66 0%, #004d1a 80%) !important;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulseCore {
      from { transform: scale(1); box-shadow: 0 0 35px #ff0055; background: radial-gradient(circle, #ff0055 0%, #4a0018 80%); }
      to { transform: scale(1.18); box-shadow: 0 0 70px #ff0055; background: radial-gradient(circle, #ff5588 0%, #4a0018 80%); }
    }

    .status-panel {
      margin-top: 35px;
      text-align: center;
      width: 90%;
      max-width: 480px;
    }

    #statusText {
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.8;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #00e5ff;
    }

    #transcript {
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 10px;
      padding: 16px;
      min-height: 60px;
      font-size: 16px;
      line-height: 1.6;
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="core-container" onclick="startJarvis()">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="center-orb" id="orb">JARVIS</div>
  </div>

  <div class="status-panel">
    <div id="statusText">EK BAAR TOUCH KARKE START KAREIN</div>
    <div id="transcript">Systems ready, Sir. Core par tap karke baat shuru karein...</div>
  </div>

<script>
  const orb = document.getElementById('orb');
  const statusText = document.getElementById('statusText');
  const transcriptDiv = document.getElementById('transcript');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isJarvisSpeaking = false;
  let activeLoop = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'hi-IN'; // Hindi recognition

    recognition.onstart = () => {
      if (!isJarvisSpeaking) {
        statusText.innerText = 'JARVIS SUN RAHA HAI... (Boliye)';
        orb.classList.add('listening-mode');
      }
    };

    recognition.onresult = (event) => {
      const userText = event.results[0][0].transcript;
      transcriptDiv.innerText = `Aap: "${userText}"`;
      orb.classList.remove('listening-mode');
      handleUserQuery(userText.toLowerCase());
    };

    recognition.onerror = (e) => {
      orb.classList.remove('listening-mode');
      if (activeLoop && !isJarvisSpeaking) {
        setTimeout(restartListening, 1000);
      }
    };

    recognition.onend = () => {
      orb.classList.remove('listening-mode');
      // Agar Jarvis bol nahi raha toh turant dubara sunna shuru kare
      if (activeLoop && !isJarvisSpeaking) {
        setTimeout(restartListening, 800);
      }
    };
  } else {
    statusText.innerText = 'SPEECH API NOT SUPPORTED';
  }

  function restartListening() {
    if (!activeLoop || isJarvisSpeaking) return;
    try {
      recognition.start();
    } catch(err) {
      // already active
    }
  }

  function startJarvis() {
    if (activeLoop) return;
    activeLoop = true;
    speakHindi("Namaste sir. Jarvis online ho chuka hai. Main aapke orders ke liye ready hoon. Bataiye kya madad karoon?");
  }

  function speakHindi(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    isJarvisSpeaking = true;
    try { recognition.stop(); } catch(e) {}

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'hi-IN';
    utterance.pitch = 0.95;
    utterance.rate = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const hindiVoice = voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi'));
    if (hindiVoice) utterance.voice = hindiVoice;

    utterance.onstart = () => {
      orb.classList.add('speaking');
      statusText.innerText = 'JARVIS BOL RAHA HAI...';
      transcriptDiv.innerText = `JARVIS: "${text}"`;
    };

    utterance.onend = () => {
      orb.classList.remove('speaking');
      isJarvisSpeaking = false;
      statusText.innerText = 'JARVIS SUN RAHA HAI...';
      if (activeLoop) {
        setTimeout(restartListening, 500);
      }
    };

    window.speechSynthesis.speak(utterance);
  }

  // Smart Hindi Agent Logic (Self-asking & Response)
  function handleUserQuery(input) {
    let reply = "";

    if (input.includes("kaun ho") || input.includes("kya ho") || input.includes("naam")) {
      reply = "Main Jarvis hoon sir, aapka personal AI system. Aap batayein, aaj hum kis project par kaam karenge?";
    } else if (input.includes("samay") || input.includes("time") || input.includes("kitne baje")) {
      const now = new Date().toLocaleTimeString('hi-IN');
      reply = `Sir, abhi samay ${now} ho raha hai. Kya aapko kisi meeting ya reminder ki zaroorat hai?`;
    } else if (input.includes("kya kar rahe ho") || input.includes("kya chal raha hai")) {
      reply = "Main aapke system diagnostics aur memory modules ko monitor kar raha hoon sir. Sabhi systems safe hain. Aapka kya order hai?";
    } else if (input.includes("kaise ho") || input.includes("kya haal hai")) {
      reply = "Main fully operational aur badhiya hoon sir. Aapka din kaisa chal raha hai?";
    } else if (input.includes("avengers") || input.includes("iron man") || input.includes("tony")) {
      reply = "Stark Industries ke sabhi protocols activate kar diye gaye hain sir. Mark suit ready hai!";
    } else if (input.includes("theek") || input.includes("badhiya") || input.includes("accha")) {
      reply = "Sun kar accha laga sir! Toh aage bataiye, main aapke liye aur kya karoon?";
    } else {
      reply = `Sir, maine suna: "${input}". Main ispar poori tarah kaam kar raha hoon. Aap mujhe aur kya command dena chahte hain?`;
    }

    speakHindi(reply);
  }
</script>
</body>
</html>
