name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Required Files
        run: |
          echo "Repo root ki files:"
          ls -la
          test -f index.html || { echo "::error::index.html repo me nahi mila (root me hona chahiye)"; exit 1; }
          test -f src/main.js || { echo "::error::src/main.js nahi mila bhai - pehle wo file banao"; exit 1; }
          echo "index.html lines: $(wc -l < index.html)"
          echo "main.js lines: $(wc -l < src/main.js)"
          if grep -q "WORKER_URL" index.html; then
            echo "::warning::index.html me purana JS bacha hua hai (WORKER_URL mila). App native voice use nahi karega."
          fi
          if grep -q "MAIN_ACTIVITY" .github/workflows/build-apk.yml; then
            echo "::warning::workflow me purana MAIN_ACTIVITY patch bacha hua hai."
          fi

      - name: Setup Fixed Signing Key
        run: |
          mkdir -p ~/.android
          shopt -s nullglob
          KEYSTORE=""
          for f in keystore/*.keystore *.keystore; do
            KEYSTORE="$f"; break
          done
          B64=""
          for f in keystore/*.b64 *.b64; do
            B64="$f"; break
          done

          if [ -n "$KEYSTORE" ]; then
            cp "$KEYSTORE" ~/.android/debug.keystore
            echo "Fixed keystore mila ($KEYSTORE) - signature ab har build me same rahega."
          elif [ -n "$B64" ]; then
            base64 -d "$B64" > ~/.android/debug.keystore
            echo "Fixed keystore mila ($B64) - signature ab har build me same rahega."
          else
            echo "::error::Keystore file repo me nahi mila. jarvis-debug.keystore.b64 upload karo (root me ya keystore/ folder me)."
            exit 1
          fi

          # sanity check: key sach me load ho raha hai?
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error::Keystore file kharab hai ya password galat hai (android)."; exit 1; }
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256|Valid" | head -3

      - name: Setup Web Directory, Bundle JS & Capacitor
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --legacy-peer-deps \
            @capacitor/core @capacitor/cli @capacitor/android \
            @capacitor/app-launcher \
            @capacitor-community/contacts \
            @capacitor-community/speech-recognition \
            @capacitor-community/text-to-speech \
            @anuradev/capacitor-background-mode
          npm install --legacy-peer-deps -D esbuild
          npx esbuild src/main.js --bundle --minify --format=iife --outfile=www/app.js
          ls -lh www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jarvis.hud",
            "appName": "JARVIS",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Inject Android Permissions
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.READ_CONTACTS" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

          sed -i '/<\/manifest>/i <queries>\n<package android:name="com.google.android.youtube" />\n<package android:name="com.android.chrome" />\n<package android:name="com.whatsapp" />\n<package android:name="com.instagram.android" />\n<package android:name="com.facebook.katana" />\n<package android:name="org.telegram.messenger" />\n<package android:name="com.snapchat.android" />\n<package android:name="com.spotify.music" />\n<package android:name="com.google.android.gm" />\n<package android:name="com.google.android.apps.maps" />\n<package android:name="com.android.vending" />\n<package android:name="com.phonepe.app" />\n<package android:name="com.google.android.apps.nbu.paisa.user" />\n<package android:name="net.one97.paytm" />\n<package android:name="in.swiggy.android" />\n<package android:name="com.application.zomato" />\n<package android:name="com.ubercab" />\n<package android:name="com.netflix.mediaclient" />\n<package android:name="com.linkedin.android" />\n<\/queries>' android/app/src/main/AndroidManifest.xml

          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml
          npx cap sync android
          ls -lh android/app/src/main/assets/public

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show APK Signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256 digest"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
