name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Web Directory, Bundle JS & Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --legacy-peer-deps \
            @capacitor/core @capacitor/cli @capacitor/android \
            @capacitor-community/speech-recognition \
            @capacitor-community/text-to-speech \
            @anuradev/capacitor-background-mode
          npm install --legacy-peer-deps -D esbuild
          npx esbuild src/main.js --bundle --minify --format=iife --outfile=www/app.js
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.jarvis.hud",
            "appName": "JARVIS",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Inject Android Permissions
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

          sed -i '/<\/manifest>/i <queries>\n<package android:name="com.google.android.youtube" />\n<package android:name="com.android.chrome" />\n<\/queries>' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
