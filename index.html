<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS Male Voice AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #02060d;
      color: #00e5ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .core-container {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 229, 255, 0.4);
      border-radius: 50%;
      animation: rotateRing 12s linear infinite;
    }

    .ring-inner {
      position: absolute;
      width: 75%;
      height: 75%;
      border: 2px solid rgba(0, 229, 255, 0.8);
      border-top-color: transparent;
      border-radius: 50%;
      animation: rotateRingRev 5s linear infinite;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .center-orb {
      width: 95px;
      height: 95px;
      background: radial-gradient(circle, #00e5ff 0%, #00485c 80%);
      border-radius: 50%;
      box-shadow: 0 0 35px #00e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .speaking {
      animation: pulseCore 0.8s infinite alternate;
    }

    .listening-mode {
      box-shadow: 0 0 55px #00ff66 !important;
      background: radial-gradient(circle, #00ff66 0%, #004d1a 80%) !important;
    }

    .thinking-mode {
      box-shadow: 0 0 55px #ffaa00 !important;
      background: radial-gradient(circle, #ffaa00 0%, #664400 80%) !important;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulseCore {
      from { transform: scale(1); box-shadow: 0 0 35px #ff0055; background: radial-gradient(circle, #ff0055 0%, #4a0018 80%); }
      to { transform: scale(1.15); box-shadow: 0 0 65px #ff0055; background: radial-gradient(circle, #ff5588 0%, #4a0018 80%); }
    }

    .status-panel {
      margin-top: 35px;
      text-align: center;
      width: 90%;
      max-width: 450px;
    }

    #statusText {
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.8;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #transcript {
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 15px;
      min-height: 55px;
      font-size: 15px;
      line-height: 1.5;
      text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="core-container" onclick="startJarvis()">
    <div class="ring-outer"></div>
    <div class="ring-inner"></div>
    <div class="center-orb" id="orb">JARVIS</div>
  </div>

  <div class="status-panel">
    <div id="statusText">TAP CORE TO START</div>
    <div id="transcript">Jarvis online hai. Ek baar tap karein...</div>
  </div>

<script>
  // Direct Inbuilt API Key
  const API_KEY = "AQ.Ab8RN6Kskt9czcu5jfbDuIV5RSf8eBDBLs4A_a2HwKJHlmNLGA";

  const orb = document.getElementById('orb');
  const statusText = document.getElementById('statusText');
  const transcriptDiv = document.getElementById('transcript');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isSpeaking = false;
  let activeLoop = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      if (!isSpeaking) {
        statusText.innerText = 'JARVIS SUN RAHA HAI...';
        orb.className = 'center-orb listening-mode';
      }
    };

    recognition.onresult = (event) => {
      const userText = event.results[0][0].transcript;
      transcriptDiv.innerText = `Aap: "${userText}"`;
      orb.className = 'center-orb thinking-mode';
      statusText.innerText = 'JARVIS SOCH RAHA HAI...';
      askGeminiFast(userText);
    };

    recognition.onerror = () => {
      orb.className = 'center-orb';
      if (activeLoop && !isSpeaking) setTimeout(restartListening, 600);
    };

    recognition.onend = () => {
      orb.className = 'center-orb';
      if (activeLoop && !isSpeaking) setTimeout(restartListening, 500);
    };
  }

  function restartListening() {
    if (!activeLoop || isSpeaking) return;
    try { recognition.start(); } catch(e) {}
  }

  function startJarvis() {
    if (activeLoop) return;
    activeLoop = true;
    speakMaleHindi("Namaste sir. Jarvis online hai. Main aapke aadesh ke liye taiyar hoon.");
  }

  // Fast AI Backend
  async function askGeminiFast(promptText) {
    const systemPrompt = "Aap Avengers ke male artificial intelligence JARVIS hain. User se hamesha aadar se 'Sir' keh kar Hinglish ya saral Hindi mein baat karein. Jawab bilkul chota, seedha aur bina kisi bullet points ya markdown symbols (*, #) ke dein, taaki turant aawaz mein bola ja sake.";

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: `${systemPrompt}\n\nUser: ${promptText}` }]
          }],
          generationConfig: {
            maxOutputTokens: 120,
            temperature: 0.6
          }
        })
      });

      const data = await response.json();
      if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
        let reply = data.candidates[0].content.parts[0].text.replace(/[*#_]/g, '').trim();
        transcriptDiv.innerText = `JARVIS: ${reply}`;
        speakMaleHindi(reply);
      } else {
        fallbackSmartReply(promptText);
      }
    } catch (err) {
      fallbackSmartReply(promptText);
    }
  }

  // Backup Local Logic agar internet slow ho
  function fallbackSmartReply(text) {
    let lower = text.toLowerCase();
    let reply = "Sir, main aapki baat sun raha hoon. Kripya apna agla command batayein.";
    if (lower.includes("kaun ho") || lower.includes("naam")) {
      reply = "Main Jarvis hoon sir, aapka personal assistant.";
    } else if (lower.includes("time") || lower.includes("samay") || lower.includes("baje")) {
      reply = `Sir, abhi samay ${new Date().toLocaleTimeString('hi-IN')} ho raha hai.`;
    } else if (lower.includes("kaise ho") || lower.includes("haal")) {
      reply = "Main bilkul badhiya hoon sir. Aapka aadesh sar aankhon par.";
    }
    transcriptDiv.innerText = `JARVIS: ${reply}`;
    speakMaleHindi(reply);
  }

  // MALE VOICE SYNTHESIS
  function speakMaleHindi(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    isSpeaking = true;
    try { recognition.stop(); } catch(e) {}

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'hi-IN';
    utterance.pitch = 0.65; // Deep heavy male tone
    utterance.rate = 1.05;  // Fast response

    const voices = window.speechSynthesis.getVoices();
    const hindiVoice = voices.find(v => (v.lang.includes('hi') || v.name.includes('Hindi')) && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('man'))) 
                       || voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi'));
    if (hindiVoice) utterance.voice = hindiVoice;

    utterance.onstart = () => {
      orb.className = 'center-orb speaking';
      statusText.innerText = 'JARVIS BOL RAHA HAI...';
    };

    utterance.onend = () => {
      orb.className = 'center-orb';
      isSpeaking = false;
      statusText.innerText = 'JARVIS SUN RAHA HAI...';
      if (activeLoop) setTimeout(restartListening, 400);
    };

    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>
